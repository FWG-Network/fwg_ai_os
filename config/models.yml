model_routing:
  # ── HuggingFace (free, no extra key needed) ───────────────────────
  default:      "HF_AGENT"        # ✅ uses AGENT_URL + HF_TOKEN
  llm_agent:    "HF_AGENT"
  trend:        "HF_AGENT"
  discovery:    "HF_AGENT"
  rag:          "HF_AGENT" # long context free
  summarize:    "HF_AGENT"

  # ── Anthropic (requires ANTHROPIC_API_KEY) ────────────────────────
  reasoning: "claude-haiku-4-5"   # cheap + fast
  code:      "claude-sonnet-4-6"  # high quality

  # ── OpenAI (requires OPENAI_API_KEY) ─────────────────────────────
  creative:     "gpt-4o"

  # ── Fast/cheap (local or HF) ──────────────────────────────────────
  fast:         "HF_AGENT"
