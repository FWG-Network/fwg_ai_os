# config/models.yml
# ── HONESTY CONSTRAINT: every task_type maps to "auto" ─────────────────
# This file NEVER claims a specific provider/model. The Python router
# (backend/lim/llm_router.py) decides at call-time which provider is
# actually reachable, based on which API keys are configured — and logs
# exactly which one answered. See MODEL_DECISIONS.md entry #6.

model_routing:
  # ── Legacy / unchanged chain: HF Agent -> HF Inference -> Mock ──────
  default:      "auto"
  llm_agent:    "auto"
  trend:        "auto"
  discovery:    "auto"
  rag:          "auto"
  summarize:    "auto"

  # ── New premium-reasoning chain: GitHub Models -> Cloudflare -> OpenRouter -> Mock
  reasoning:    "auto"
  story:        "auto"

  # ── Writer chain: GitHub Models -> OpenRouter -> Mock (no Cloudflare) ──
  writer:       "auto"
  code:         "auto"     # kept in writer-tier: needs strong logic, not bulk/background
  creative:     "auto"     # ASSUMPTION: folded into writer-tier — confirm if this should
                            # instead follow the "story" chain (Cloudflare included)

  # ── Fast/cheap/background chain: Cloudflare -> OpenRouter -> Mock ───
  fast:         "auto"
