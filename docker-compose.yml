version: '3.9'

services:
  # 1. The PostgreSQL Database Service
  db:
    image: postgres:14
    container_name: aios_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"

  # 2. The Redis Caching & Broker Service
  redis:
    image: redis:7
    container_name: aios_redis
    ports:
      - "6379:6379"

  # 3. Our Main Backend API Service
  api:
    build: .
    container_name: aios_api
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=db  # <-- Use service name as hostname
      - REDIS_HOST=redis    # <-- Use service name as hostname
    depends_on:
      - db
      - redis
    env_file:
      - .env

  # 4. Our Real-Time Learning Worker Service
  worker:
    build: .
    container_name: aios_worker
    command: celery -A backend.worker.celery_app worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
    depends_on:
      - redis
    env_file:
      - .env

volumes:
  postgres_data:
