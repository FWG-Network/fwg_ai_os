version: '3.9'

services:
  db:
    image: postgres:14
    container_name: aios_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-viral}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viral}
      POSTGRES_DB: ${POSTGRES_DB:-viral}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: aios_redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aios_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    container_name: aios_api
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app/backend
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
    depends_on:
      - db
      - redis
      - qdrant
    env_file:
      - .env

  worker:
    build: .
    container_name: aios_worker
    command: celery -A backend.worker.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-1}
    volumes:
      - ./backend:/app/backend
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
    depends_on:
      - redis
      - qdrant
    env_file:
      - .env

volumes:
  postgres_data:
  qdrant_data:
