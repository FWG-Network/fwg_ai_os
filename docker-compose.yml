version: '3.9'

services:
  db:
    image: postgres:14
    container_name: aios_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: aios_redis
    ports:
      - "6379:6379"

  # ★★★ NEW: Vector Database Service ★★★
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: aios_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    container_name: aios_api
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant # <-- New env var
    depends_on: 
      - db
      - redis
      - qdrant
    env_file:
      - .env

  worker:
    build: .
    container_name: aios_worker
    # ★★★ FIX: Default concurrency set to 1 for sequential loop and RAM saving ★★★
    command: celery -A backend.worker.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-1}
    volumes:
      - .:/app
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant # <-- New env var
    depends_on:
      - redis
      - qdrant
    env_file:
      - .env

volumes:
  postgres_data:
  qdrant_data:
